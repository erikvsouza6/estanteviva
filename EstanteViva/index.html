<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante Viva</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <h2>Estante Viva</h2>
            <div>
                <a href="">Catálogo</a>
                <a href="">Cadastro</a>
            </div>

        </nav>

    </header>

    <h1>Gerenciamento de livros</h1>
    <form action="">
        <h3>Cadastrar livro</h3>
        <div class="formulario">
            <div class="formulario-linha">
                <div class="formulario-label">
                    <label for="título">Título *</label>
                    <input type="text" placeholder="informe o Título">
                </div>

                <div class="formulario-label">
                    <lable for="auto">Auto *</lable>
                    <input type="text" placeholder="informe o autor">
                </div>
            </div>

            <div class="formulario-linha">
                <div class="formulario-label">
                    <label for="preço (R$)">Preço (R$) *</label>
                    <input type="text" placeholder="0.00">
                </div>

                <div class="formulario-label">
                    <label for="estoque">Quantidade em estoque *</label>
                    <input type="text" placeholder="0">
                </div>
            </div>
            <button type="submit">Cadastrar livro</button>
        </div>

    </form>
    <section>
        <h3>Catálogo de livros</h3>
        <label for="Buscar por parte do título"></label>
        <input type="text" placeholder="Buscar por parte do título">
        <button>Buscar</button>
        <button>Limpar</button>
    </section>
    <br><br>

    <table>
        <thead>
            <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Título cadastrado</td>
                <td>Nome do autor</td>
                <td>R$ 0.00</td>
                <td>0</td>
                <td>
                    <button>Editar</button>
                    <button>Excluir</button>
                </td>
            </tr>
            <tr>
                <td>Título cadastrado</td>
                <td>Nome do autor</td>
                <td>R$ 0.00</td>
                <td>0</td>
                <td>
                    <button>Editar</button>
                    <button>Excluir</button>
                </td>
            </tr>
        </tbody>
    </table>
    <footer>
        Estante Viva — Gerenciamento de catálogo
    </footer>

</body>

</html>
